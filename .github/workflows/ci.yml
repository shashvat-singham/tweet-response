name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: JS engine matches the Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ml/export.py writes docs/model/golden.json from the numpy reference
      # implementation. This replays those inputs through the JavaScript engine
      # that actually ships and fails on any drift past 1e-4.
      - name: engine parity
        run: node ml/parity.mjs

      - name: artefacts present and sane
        run: |
          test -s docs/model/weights.bin
          test -s docs/model/vocab.json
          test -s docs/model/metrics.json
          node -e "const m=require('./docs/model/metrics.json');
            if(!(m.headline.test_accuracy>0.8)) throw new Error('accuracy regressed');
            if(m.classes.length!==6) throw new Error('class count changed');
            if(m.headline.int8_argmax_agreement<0.99) throw new Error('quantisation drifted');
            console.log('metrics ok — test accuracy', m.headline.test_accuracy)"

      # Vercel deploys docs/ on every push to main via the Git integration;
      # this job is the gate that tells you when that deploy is wrong.
      - name: no stray references to a build step
        run: |
          ! grep -rn "node_modules" docs/index.html docs/assets || exit 1
